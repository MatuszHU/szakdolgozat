name: Tests

on:
  push:
    branches: [ "master", "bdd-setup" ]
  pull_request:
    branches: [ "master" ]

jobs:
  sharedkit:
    name: SharedKit unit tests (TDD)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Run tests
        working-directory: SharedKit
        run: swift test

  worker:
    name: NightlifeWorker BDD + UI tests
    runs-on: macos-latest
    # The hosted runner has no iOS 27 SDK/runtime yet (deployment target is 27.0),
    # so this job cannot pass there. Run the Worker test plan locally until it does,
    # then remove this line.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator
      - name: Pick iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import sys, json
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[-1].split("-")])
          for runtime in reversed(ios):
              phones = [d for d in runtimes[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(runtime, phones[0]["name"], file=sys.stderr)
                  print(phones[0]["udid"])
                  break
          ')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run test plan
        run: |
          xcodebuild test \
            -workspace NightLifeApps.xcworkspace \
            -scheme NightlifeWorker \
            -testPlan NightlifeWorker \
            -destination "id=$DEVICE_ID" \
            -resultBundlePath TestResults.xcresult
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NightlifeWorker-TestResults
          path: TestResults.xcresult
