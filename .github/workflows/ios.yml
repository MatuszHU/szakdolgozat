name: Tests

on:
  push:
    branches: [ "master", "bdd-setup" ]
  pull_request:
    branches: [ "master" ]

jobs:
  sharedkit:
    name: SharedKit unit tests (TDD)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Run tests
        working-directory: SharedKit
        run: swift test

  worker:
    name: NightlifeWorker BDD + UI tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -5
      - name: Run test plan
        run: |
          xcodebuild test \
            -workspace NightLifeApps.xcworkspace \
            -scheme NightlifeWorker \
            -testPlan NightlifeWorker \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -resultBundlePath TestResults.xcresult
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NightlifeWorker-TestResults
          path: TestResults.xcresult
